<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奈落鯖実績システム - Abyss Achievements Full Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        .achievement-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .achievement-card.locked {
            filter: grayscale(1);
            opacity: 0.5;
        }

        .achievement-card:hover:not(.locked) {
            transform: translateY(-8px) scale(1.02);
            border-color: #38bdf8;
            box-shadow: 0 20px 25px -5px rgba(56, 189, 248, 0.2);
        }

        .progress-bar {
            height: 10px;
            background: #334155;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0ea5e9, #38bdf8);
            transition: width 0.5s ease-out;
        }

        .update-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 6px;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .update-btn:hover {
            background: #38bdf8;
            color: white;
        }

        #toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 200;
        }
    </style>
</head>
<body class="min-h-screen pb-20">

    <nav class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 group cursor-pointer">
                <div class="p-2 bg-sky-500/10 rounded-lg group-hover:bg-sky-500/20 transition">
                    <i class="fas fa-ghost text-sky-400 text-2xl"></i>
                </div>
                <span class="text-xl font-black tracking-tighter italic">ABYSS <span class="text-sky-400">ACHIEVEMENTS</span></span>
            </div>
            <div id="auth-section">
                <button id="nav-login-btn" class="bg-gradient-to-r from-[#5865F2] to-[#4752C4] px-6 py-2.5 rounded-full font-bold flex items-center space-x-2 hover:shadow-[0_0_15px_rgba(88,101,242,0.5)] transition-all active:scale-95">
                    <i class="fab fa-discord"></i>
                    <span>Discordで連携</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 mt-12">
        <!-- Profile Section -->
        <div id="user-profile" class="hidden mb-12 p-8 rounded-3xl bg-slate-800/40 border border-slate-700/50 backdrop-blur-sm flex flex-col md:flex-row items-center space-y-6 md:space-y-0 md:space-x-10">
            <img id="user-avatar" src="" alt="Avatar" class="w-28 h-28 rounded-full border-4 border-slate-900 shadow-xl">
            <div class="flex-1 text-center md:text-left">
                <h2 id="user-name" class="text-4xl font-black text-white mb-2">---</h2>
                <p class="text-slate-500 font-mono text-sm mb-6">ID: <span id="user-id">---</span></p>
                <div class="flex flex-wrap justify-center md:justify-start gap-4">
                    <div class="bg-slate-900/80 px-6 py-3 rounded-2xl border border-slate-700">
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">達成済みの試練</p>
                        <p class="text-2xl font-black text-white"><span id="completion-count">0</span> / <span id="total-count">0</span></p>
                    </div>
                    <div class="bg-slate-900/80 px-6 py-3 rounded-2xl border border-slate-700">
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">達成率</p>
                        <p id="completion-percent" class="text-2xl font-black text-sky-400">0%</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="achievements-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <div id="login-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center z-[100] px-4">
        <div class="bg-slate-900 p-10 rounded-[2.5rem] border border-slate-800 max-w-md w-full text-center">
            <h2 class="text-3xl font-black mb-4 text-white">連携が必要です</h2>
            <button id="modal-login-btn" class="w-full bg-gradient-to-r from-[#5865F2] to-[#4752C4] py-5 rounded-2xl font-black text-lg flex items-center justify-center space-x-4">
                <i class="fab fa-discord text-2xl"></i>
                <span>Discordで今すぐ連携</span>
            </button>
        </div>
    </div>

    <div id="toast-container"></div>

    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-analytics.js";
      // TODO: Add SDKs for Firebase products that you want to use
      // https://firebase.google.com/docs/web/setup#available-libraries
    
      // Your web app's Firebase configuration
      // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
          apiKey: "AIzaSyDU4KAhuWrDkWAHSQL312F9hd9GULvXfcI",
          authDomain: "naraku-archievements.firebaseapp.com",
          projectId: "naraku-archievements",
          storageBucket: "naraku-archievements.firebasestorage.app",
          messagingSenderId: "1077300098321",
          appId: "1:1077300098321:web:3c4538e4387c09750948b0",
          measurementId: "G-NV3MT8D2VV"
        };

        const CLIENT_ID = '1500128602749141052';
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        const APP_ID = 'naraku-achievements'; 

        let db = null;
        let currentUser = null;
        let achievementData = [
            { id: "step1", title: "奈落への一歩", desc: "サーバーに参加し、最初の挨拶をする", icon: "fa-door-open", color: "text-blue-400", requirement: 1, current: 0 },
            { id: "talker", title: "おしゃべり好き", desc: "合計1,000メッセージを送信する", icon: "fa-comments", color: "text-green-400", requirement: 1000, current: 0 },
            { id: "regular", title: "常連客", desc: "サーバーに参加してから3ヶ月が経過する", icon: "fa-calendar-check", color: "text-purple-400", requirement: 90, current: 0 }
        ];

        // 🟢 リアルタイムでFirestoreを更新する関数
        const updateStatInFirestore = async (statId, newValue) => {
            if (!db || !currentUser) return;
            const docRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'userStats', currentUser.id);
            try {
                // merge: true で、他の数値を消さずに特定の項目だけ更新
                await setDoc(docRef, { [statId]: newValue }, { merge: true });
                console.log(`Updated ${statId} to ${newValue}`);
            } catch (e) {
                console.error("Update failed:", e);
            }
        };

        function showToast(title) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'mb-4 bg-slate-900 border border-sky-500 p-4 rounded-2xl shadow-2xl flex items-center space-x-4 animate-bounce';
            toast.innerHTML = `<div class="bg-sky-500 p-2 rounded-lg text-white"><i class="fas fa-award"></i></div><div><p class="text-white font-bold">${title} 解除！</p></div>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        const renderAchievements = () => {
            const grid = document.getElementById('achievements-grid');
            if(!grid) return;
            grid.innerHTML = '';
            
            const unlockedCount = achievementData.filter(a => a.current >= a.requirement).length;

            achievementData.forEach(ach => {
                const isUnlocked = ach.current >= ach.requirement;
                const progressPercent = Math.min(100, (ach.current / ach.requirement) * 100);
                const card = document.createElement('div');
                card.className = `achievement-card p-8 rounded-[2rem] flex flex-col h-full ${!isUnlocked ? 'locked' : ''}`;
                card.innerHTML = `
                    <div class="flex items-start justify-between mb-6">
                        <div class="w-14 h-14 rounded-2xl bg-slate-900 flex items-center justify-center border border-slate-700">
                            <i class="fas ${ach.icon} ${ach.color} text-3xl"></i>
                        </div>
                    </div>
                    <h4 class="font-black text-xl mb-2 text-white">${ach.title}</h4>
                    <p class="text-sm text-slate-500 mb-8 flex-grow">${ach.desc}</p>
                    <div class="mt-auto space-y-3">
                        <div class="flex justify-between items-end">
                            <span class="text-sm font-bold text-slate-400">${ach.current} / ${ach.requirement}</span>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${progressPercent}%"></div></div>
                        <button class="update-btn" data-id="${ach.id}" data-current="${ach.current}">
                            <i class="fas fa-plus mr-1"></i> テスト加算
                        </button>
                    </div>
                `;
                
                // ボタンにクリックイベントを追加
                card.querySelector('.update-btn').addEventListener('click', (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    const current = parseInt(e.currentTarget.getAttribute('data-current'));
                    updateStatInFirestore(id, current + 1); // Firestoreの数値を+1する
                });

                grid.appendChild(card);
            });

            document.getElementById('completion-count').innerText = unlockedCount;
            document.getElementById('total-count').innerText = achievementData.length;
            document.getElementById('completion-percent').innerText = `${Math.round((unlockedCount / achievementData.length) * 100)}%`;
        };

        const init = async () => {
            document.getElementById('nav-login-btn').onclick = () => {
                window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
            };
            document.getElementById('modal-login-btn').onclick = document.getElementById('nav-login-btn').onclick;

            try {
                const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
                const app = initializeApp(config);
                db = getFirestore(app);
                const auth = getAuth(app);
                await signInAnonymously(auth);
            } catch (e) { console.error(e); }

            const params = new URLSearchParams(window.location.hash.slice(1));
            const token = params.get('access_token');

            if (token) {
                const res = await fetch('https://discord.com/api/users/@me', { headers: { Authorization: `Bearer ${token}` } });
                if (res.ok) {
                    currentUser = await res.json();
                    document.getElementById('login-modal').classList.add('hidden');
                    document.getElementById('user-profile').classList.remove('hidden');
                    document.getElementById('user-name').innerText = currentUser.global_name || currentUser.username;
                    document.getElementById('user-id').innerText = currentUser.id;
                    document.getElementById('user-avatar').src = `https://cdn.discordapp.com/avatars/${currentUser.id}/${currentUser.avatar}.png`;
                    
                    const statsDoc = doc(db, 'artifacts', APP_ID, 'public', 'data', 'userStats', currentUser.id);
                    onSnapshot(statsDoc, (snapshot) => {
                        if (snapshot.exists()) {
                            const data = snapshot.data();
                            achievementData = achievementData.map(ach => {
                                const newVal = data[ach.id] !== undefined ? Number(data[ach.id]) : 0;
                                if (newVal >= ach.requirement && ach.current < ach.requirement) showToast(ach.title);
                                return { ...ach, current: newVal };
                            });
                            renderAchievements();
                        }
                    });
                }
            }
            renderAchievements();
        };

        init();
    </script>
</body>
</html>
