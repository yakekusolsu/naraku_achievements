<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奈落鯖実績システム - Abyss Achievements</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
        }

        .achievement-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            transition: all 0.3s ease;
        }

        .achievement-card.locked {
            filter: grayscale(1);
            opacity: 0.6;
        }

        .achievement-card:hover:not(.locked) {
            transform: translateY(-5px);
            border-color: #38bdf8;
            box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.3);
        }

        .discord-gradient {
            background: linear-gradient(90deg, #5865F2, #4752C4);
        }

        .progress-bar {
            height: 8px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #38bdf8;
            transition: width 1s ease-in-out;
        }

        #custom-alert {
            display: none;
            background: rgba(0,0,0,0.9);
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i class="fas fa-ghost text-sky-400 text-2xl"></i>
                <span class="text-xl font-bold tracking-wider">奈落鯖 ACHIEVEMENTS</span>
            </div>
            <div id="auth-section">
                <button id="login-btn" onclick="redirectToDiscord()" class="discord-gradient px-6 py-2 rounded-full font-bold flex items-center space-x-2 hover:opacity-90 transition">
                    <i class="fab fa-discord"></i>
                    <span>Discordでログイン</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 mt-8">
        <div id="user-profile" class="hidden mb-12 p-8 rounded-2xl bg-slate-800/50 border border-slate-700 flex flex-col md:flex-row items-center space-y-6 md:space-y-0 md:space-x-8">
            <div class="relative">
                <img id="user-avatar" src="" alt="Avatar" class="w-24 h-24 rounded-full border-4 border-sky-500">
                <div class="absolute bottom-0 right-0 w-6 h-6 bg-green-500 border-4 border-slate-800 rounded-full"></div>
            </div>
            <div class="flex-1 text-center md:text-left">
                <h2 id="user-name" class="text-3xl font-bold mb-1 text-white"></h2>
                <p class="text-slate-400 mb-4">Discord ID：<span id="user-id" class="text-sky-400 font-mono"></span></p>
                <div class="flex flex-wrap justify-center md:justify-start gap-4">
                    <div class="bg-slate-900 px-4 py-2 rounded-lg border border-slate-700">
                        <p class="text-xs text-slate-500 uppercase">達成率</p>
                        <p class="text-lg font-bold"><span id="completion-count">0</span> / <span id="total-count">0</span></p>
                    </div>
                    <div class="bg-slate-900 px-4 py-2 rounded-lg border border-slate-700">
                        <p class="text-xs text-slate-500 uppercase">総合ランク</p>
                        <p id="user-rank" class="text-lg font-bold text-yellow-400">奈落の探索者</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-between mb-6">
            <h3 class="text-xl font-bold border-l-4 border-sky-500 pl-4 text-white">実績一覧</h3>
            <div class="flex space-x-2">
                <button onclick="filterAchievements('all')" class="text-sm bg-slate-800 px-3 py-1 rounded hover:bg-slate-700 transition">すべて</button>
                <button onclick="filterAchievements('unlocked')" class="text-sm bg-slate-800 px-3 py-1 rounded hover:bg-slate-700 transition">達成済み</button>
            </div>
        </div>

        <div id="achievements-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- JS生成 -->
        </div>
    </main>

    <div id="login-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-[100] px-4">
        <div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 max-w-md w-full text-center">
            <div class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-lock text-3xl text-sky-400"></i>
            </div>
            <h2 class="text-2xl font-bold mb-4">実績を同期しよう</h2>
            <p class="text-slate-400 mb-8">奈落鯖でのあなたの伝説を確認するには、Discordアカウントとの連携が必要です。</p>
            <button onclick="redirectToDiscord()" class="w-full discord-gradient py-4 rounded-xl font-bold text-lg flex items-center justify-center space-x-3 hover:scale-[1.02] transition">
                <i class="fab fa-discord text-2xl"></i>
                <span>Discordで今すぐ連携</span>
            </button>
        </div>
    </div>

    <div id="custom-alert" class="fixed inset-0 flex items-center justify-center z-[110] px-4">
        <div class="bg-slate-900 border border-red-500 p-6 rounded-xl max-w-sm w-full shadow-2xl">
            <h3 class="text-red-500 font-bold text-xl mb-2 flex items-center">
                <i class="fas fa-exclamation-triangle mr-2"></i> 設定エラー
            </h3>
            <p id="alert-message" class="text-slate-300 mb-4 text-sm"></p>
            <button onclick="document.getElementById('custom-alert').style.display='none'" class="w-full bg-slate-800 py-2 rounded font-bold hover:bg-slate-700 transition">閉じる</button>
        </div>
    </div>

    <script>
        const CLIENT_ID = '1500128602749141052'; 
        // GitHub Pages用にURLを動的に取得（クエリやハッシュを除去したもの）
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        const achievementData = [
            { id: 1, title: "奈落への一歩", desc: "サーバーに参加し、最初の挨拶をする", icon: "fa-door-open", color: "text-blue-400", requirement: 1, current: 1, unlocked: true },
            { id: 2, title: "おしゃべり好き", desc: "合計1,000メッセージを送信する", icon: "fa-comments", color: "text-green-400", requirement: 1000, current: 452, unlocked: false },
            { id: 3, title: "常連客", desc: "サーバーに参加してから3ヶ月が経過する", icon: "fa-calendar-check", color: "text-purple-400", requirement: 90, current: 120, unlocked: true },
            { id: 4, title: "夜更かし", desc: "午前3時にメッセージを送信する", icon: "fa-moon", color: "text-yellow-200", requirement: 1, current: 1, unlocked: true },
            { id: 5, title: "リアクション王", desc: "他人の投稿に合計500個のリアクションを付ける", icon: "fa-grin-squint", color: "text-pink-400", requirement: 500, current: 128, unlocked: false },
            { id: 6, title: "奈落の守護者", desc: "管理スタッフとしてサーバーに貢献する", icon: "fa-shield-halved", color: "text-red-400", requirement: 1, current: 0, unlocked: false },
            { id: 7, title: "イベント主催者", desc: "VCでイベントを1回以上開催する", icon: "fa-trophy", color: "text-yellow-500", requirement: 1, current: 0, unlocked: false },
            { id: 8, title: "情報の運び屋", desc: "役立つリンクを10回以上シェアする", icon: "fa-link", color: "text-cyan-400", requirement: 10, current: 10, unlocked: true },
            { id: 9, title: "深淵を覗く者", desc: "秘密のチャンネルを発見する", icon: "fa-eye", color: "text-indigo-500", requirement: 1, current: 0, unlocked: false }
        ];

        function showAlert(msg) {
            document.getElementById('alert-message').innerText = msg;
            document.getElementById('custom-alert').style.display = 'flex';
        }

        function redirectToDiscord() {
            if (CLIENT_ID === 'YOUR_CLIENT_ID_HERE' || CLIENT_ID === '') {
                showAlert('Client IDが設定されていません。コード内のCLIENT_IDを書き換えてください。');
                return;
            }
            const scope = encodeURIComponent('identify');
            const responseType = 'token';
            const url = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=${responseType}&scope=${scope}`;
            window.location.href = url;
        }

        function getAccessToken() {
            const hash = window.location.hash;
            if (!hash) return null;
            const params = new URLSearchParams(hash.substring(1));
            return params.get('access_token');
        }

        async function fetchDiscordUser(token) {
            try {
                const response = await fetch('https://discord.com/api/users/@me', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Auth failed');
                return await response.json();
            } catch (err) {
                return null;
            }
        }

        function renderAchievements(filter = 'all') {
            const grid = document.getElementById('achievements-grid');
            grid.innerHTML = '';
            const filtered = achievementData.filter(a => filter === 'unlocked' ? a.unlocked : true);

            filtered.forEach(ach => {
                const progressPercent = Math.min(100, (ach.current / ach.requirement) * 100);
                const card = document.createElement('div');
                card.className = `achievement-card p-6 rounded-xl flex flex-col h-full ${!ach.unlocked ? 'locked' : ''}`;
                card.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <div class="w-12 h-12 rounded-lg bg-slate-900 flex items-center justify-center border border-slate-700">
                            <i class="fas ${ach.icon} ${ach.color} text-2xl"></i>
                        </div>
                        ${ach.unlocked ? '<span class="bg-sky-500/20 text-sky-400 text-[10px] font-bold px-2 py-1 rounded uppercase tracking-widest">Unlocked</span>' : '<i class="fas fa-lock text-slate-600"></i>'}
                    </div>
                    <h4 class="font-bold text-lg mb-1 text-white">${ach.title}</h4>
                    <p class="text-sm text-slate-400 mb-6 leading-relaxed flex-grow">${ach.desc}</p>
                    <div class="mt-auto">
                        <div class="flex justify-between text-xs mb-2 text-slate-500">
                            <span>進捗</span>
                            <span>${ach.current} / ${ach.requirement}</span>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${progressPercent}%"></div></div>
                    </div>
                `;
                grid.appendChild(card);
            });
            document.getElementById('completion-count').innerText = achievementData.filter(a => a.unlocked).length;
            document.getElementById('total-count').innerText = achievementData.length;
        }

        function logout() {
            window.location.hash = '';
            window.location.href = REDIRECT_URI;
        }

        window.onload = async () => {
            const token = getAccessToken();
            if (token) {
                const user = await fetchDiscordUser(token);
                if (user) {
                    document.getElementById('login-modal').classList.add('hidden');
                    document.getElementById('user-profile').classList.remove('hidden');
                    document.getElementById('user-name').innerText = user.global_name || user.username;
                    document.getElementById('user-id').innerText = user.id;
                    const avatarUrl = user.avatar 
                        ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`
                        : `https://cdn.discordapp.com/embed/avatars/0.png`;
                    document.getElementById('user-avatar').src = avatarUrl;
                    document.getElementById('auth-section').innerHTML = `
                        <div class="flex items-center space-x-3 bg-slate-800 p-1 pr-4 rounded-full border border-slate-700">
                            <img src="${avatarUrl}" class="w-8 h-8 rounded-full">
                            <span class="font-medium text-sm">${user.username}</span>
                            <button onclick="logout()" class="text-slate-500 hover:text-red-400 ml-2"><i class="fas fa-sign-out-alt"></i></button>
                        </div>
                    `;
                    // トークンを隠す
                    window.history.replaceState(null, null, REDIRECT_URI);
                }
            }
            renderAchievements();
        };

        function filterAchievements(type) { renderAchievements(type); }
    </script>
</body>
</html>
