    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
        
        :root {
            --bg-deep: #1e1f22;
            --bg-sidebar: #2b2d31;
            --bg-main: #313338;
            --bg-card: #232428;
            --text-normal: #dbdee1;
            --text-muted: #949ba4;
            --discord-blue: #5865f2;
            --discord-green: #23a55a;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-normal);
            margin: 0;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .server-sidebar {
            width: 72px;
            background-color: var(--bg-deep);
            display: none; 
            flex-direction: column;
            align-items: center;
            padding-top: 12px;
            gap: 8px;
        }

        .channel-sidebar {
            width: 240px;
            background-color: var(--bg-sidebar);
            display: none;
            flex-direction: column;
            border-top-left-radius: 8px;
        }

        @media (min-width: 768px) {
            body { overflow: hidden; }
            .server-sidebar { display: flex; }
            .channel-sidebar { display: flex; }
        }

        .server-icon {
            width: 48px;
            height: 48px;
            background-color: var(--bg-main);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .server-icon:hover {
            border-radius: 16px;
            background-color: var(--discord-blue);
            color: white;
        }

        .server-icon.active {
            border-radius: 16px;
            background-color: var(--discord-blue);
        }

        .main-content {
            flex: 1;
            background-color: var(--bg-main);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            width: 100%;
        }

        .main-content::-webkit-scrollbar { width: 16px; }
        .main-content::-webkit-scrollbar-track { background: var(--bg-main); }
        .main-content::-webkit-scrollbar-thumb { 
            background: #1a1b1e; 
            border: 4px solid var(--bg-main);
            border-radius: 8px;
        }

        .achievement-card {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 16px;
            border: 1px solid transparent;
            transition: border 0.2s;
        }

        .progress-bar {
            height: 8px;
            background: #4e5058;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--discord-blue);
            transition: width 0.3s ease;
        }

        .discord-btn {
            background-color: var(--discord-blue);
            color: white;
            padding: 8px 16px;
            border-radius: 3px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .discord-btn:hover {
            background-color: #4752c4;
        }

        .ranking-item {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid transparent;
            transition: transform 0.2s, background-color 0.2s;
        }

        .ranking-item:hover {
            background-color: #2b2d31;
            transform: translateX(4px);
        }

        .rank-badge {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            border-radius: 50%;
            font-size: 14px;
            flex-shrink: 0;
        }

        .rank-1 { background-color: #f1c40f; color: #1e1f22; }
        .rank-2 { background-color: #bdc3c7; color: #1e1f22; }
        .rank-3 { background-color: #e67e22; color: #1e1f22; }
        .rank-other { color: var(--text-muted); }

        .medal-icon {
            font-size: 18px;
        }

</head>

            { id: "daily_3", title: "累計365日", desc: "累計365日、サーバーに現れる", icon: "fa-calendar-check", color: "text-green-500", requirement: 365 },

            { id: "loyal_user", title: "忠誠の証", desc: "Nitroブーストを累計3ヶ月継続する", icon: "fa-gem", color: "text-pink-600", requirement: 3 },

            { id: "bump_2", title: "広報担当 Lv.2", desc: "サーバー宣伝コマンドを500回実行する", icon: "fa-bullhorn", color: "text-yellow-400", requirement: 500 },
            { id: "bump_3", title: "奈落の宣伝隊長", desc: "サーバー宣伝コマンドを5000回実行する", icon: "fa-megaphone", color: "text-yellow-500", requirement: 5000 },
            { id: "bump_4", title: "宣伝の不死王", desc: "サーバー宣伝コマンドを5万回実行する", icon: "fa-megaphone", color: "text-yellow-500", requirement: 50000 },
            { id: "inviter_1", title: "人脈の主 Lv.1", desc: "友達を1人招待する", icon: "fa-user-plus", color: "text-blue-300", requirement: 1 },
            { id: "inviter_2", title: "人脈の主 Lv.2", desc: "友達を5人招待する", icon: "fa-users-plus", color: "text-blue-400", requirement: 5 },
            { id: "inviter_3", title: "奈落の外交官", desc: "友達を20人招待する", icon: "fa-handshake", color: "text-blue-500", requirement: 20 },
            { id: "booster", title: "サーバーの光", desc: "Nitroブーストを開始する", icon: "fa-rocket", color: "text-fuchsia-400", requirement: 1 },

            { id: "commander_2", title: "コマンド Lv.2", desc: "Botコマンドを500回使用する", icon: "fa-terminal", color: "text-gray-400", requirement: 500 },
            { id: "commander_3", title: "自動化の鬼", desc: "Botコマンドを2000回使用する", icon: "fa-gears", color: "text-gray-500", requirement: 2000 },
            { id: "supporter", title: "良き相談役", desc: "ヘルプチャンネルで3回回答する", icon: "fa-hands-helping", color: "text-rose-400", requirement: 3 },
            { id: "event_fan", title: "イベント好き", desc: "公式イベントに3回参加する", icon: "fa-ticket", color: "text-orange-500", requirement: 3 },
            { id: "deep_abyss", title: "深淵の管理者", desc: "合計メッセージ数が100,000を超える", icon: "fa-skull-crossbones", color: "text-red-700", requirement: 100000 },
            { id: "legend", title: "奈落の伝説", desc: "合計50個以上の実績を解除する", icon: "fa-gem", color: "text-violet-500", requirement: 50 },
            { id: "boost_multi_1", title: "熱烈な支持者", desc: "同時に2つ以上のブーストを維持する", icon: "fa-rocket", color: "text-pink-400", requirement: 2 },
            { id: "boost_multi_2", title: "奈落の太柱", desc: "同時に7つ以上のブーストを維持する", icon: "fa-rocket", color: "text-pink-500", requirement: 7 },
            { id: "boost_long_1", title: "継続の星", desc: "累計半年間ブーストを継続する", icon: "fa-star", color: "text-yellow-400", requirement: 6 },
            { id: "boost_long_2", title: "永遠の守護者", desc: "累計1年間ブーストを継続する", icon: "fa-shield-heart", color: "text-yellow-500", requirement: 12 },
            { id: "boost_premium_talk", title: "特権階級の余裕", desc: "ブースト期間中に合計10,000メッセージを送信する", icon: "fa-gem", color: "text-cyan-400", requirement: 10000 },
            { id: "boost_anniversary", title: "祝杯のロケット", desc: "サーバーの記念日にブーストを行う", icon: "fa-wine-glass-empty", color: "text-red-400", requirement: 1 },
            { id: "boost_speed", title: "光速のブースト", desc: "サーバー参加から24時間以内にブーストを行う", icon: "fa-bolt", color: "text-blue-500", requirement: 1 },
            { id: "boost_max_level", title: "深淵の極致", desc: "サーバーがレベル3の時にブーストを維持する", icon: "fa-angles-up", color: "text-fuchsia-600", requirement: 1 }
        ];

        // 各実績の状態を管理する配列 (マスタをコピー)
        let achievementData = achievementDataMaster.map(a => ({ ...a, current: 0 }));

        function showToast(title) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-[#111214] border-l-4 border-discord-blue p-4 mb-2 shadow-2xl flex items-center space-x-3 min-w-[280px] transition-opacity duration-500 animate-bounce';
            toast.innerHTML = `<div class="bg-[#f1c40f] p-1.5 rounded-full"><i class="fas fa-trophy text-white text-xs"></i></div> <span class="text-sm font-bold">${title} を解除！</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 4000);
        }

        const renderAchievements = () => {
            const grid = document.getElementById('achievements-grid');
            if(!grid) return;
            grid.innerHTML = '';
            
            const unlockedCount = achievementData.filter(a => a.current >= a.requirement).length;

            achievementData.forEach(ach => {
                const isUnlocked = ach.current >= ach.requirement;
                const progressPercent = Math.min(100, (ach.current / ach.requirement) * 100);
                const card = document.createElement('div');
                card.className = `achievement-card flex flex-col ${!isUnlocked ? 'opacity-50 grayscale' : 'border-discord-blue/20 bg-[#2b2d31]/40'}`;
                card.innerHTML = `
                    <div class="flex items-start space-x-3">
                        <div class="w-12 h-12 shrink-0 rounded-lg bg-bg-deep flex items-center justify-center relative border border-white/5">
                            <i class="fas ${ach.icon} ${ach.color} text-2xl"></i>
                            ${isUnlocked ? '<div class="absolute -top-1 -right-1 bg-discord-green w-4 h-4 rounded-full border-[3px] border-bg-card flex items-center justify-center"><i class="fas fa-check text-[8px] text-white"></i></div>' : ''}
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-[#f2f3f5] truncate">${ach.title}</h4>
                            <p class="text-[12px] text-text-muted leading-tight mt-1 line-clamp-2">${ach.desc}</p>
                        </div>
                    </div>
                    <div class="mt-4 space-y-1.5">
                        <div class="flex justify-between items-center text-[10px] font-bold uppercase tracking-wider text-text-muted">
                            <span>Progress</span>
                            <span class="${isUnlocked ? 'text-discord-green' : ''}">${ach.current.toLocaleString()} / ${ach.requirement.toLocaleString()}</span>
                        </div>
                        <div class="progress-bar"><div class="progress-fill ${isUnlocked ? 'bg-discord-green' : ''}" style="width: ${progressPercent}%"></div></div>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('completion-count').innerText = unlockedCount;
            document.getElementById('total-count').innerText = achievementData.length;
            document.getElementById('completion-percent').innerText = `${Math.round((unlockedCount / achievementData.length) * 100)}%`;
        };

        const renderRanking = async () => {
            const list = document.getElementById('ranking-list');
            if (!list || !db) return;

            try {
                const statsCol = collection(db, 'artifacts', APP_ID, 'public', 'data', 'userStats');
                const snapshot = await getDocs(statsCol);
                
                const rankingData = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    let count = 0;
                    achievementDataMaster.forEach(master => {
                        if (data[master.id] !== undefined && Number(data[master.id]) >= master.requirement) {
                            count++;
                        }
                    });
                    rankingData.push({ 
                        id: docSnap.id, 
                        count: count, 
                        name: data.userName || 'Unknown User', 
                        avatar: data.userAvatar || 'https://cdn.discordapp.com/embed/avatars/0.png'
                    });
                });

                rankingData.sort((a, b) => b.count - a.count);

                list.innerHTML = '';
                
                if (rankingData.length === 0) {
                    list.innerHTML = '<p class="text-center py-10 text-text-muted">データが存在しません</p>';
                    return;
                }

                rankingData.forEach((user, index) => {
                    const rank = index + 1;
                    const isMe = currentUserData && user.id === currentUserData.id;
                    const item = document.createElement('div');
                    item.className = `ranking-item ${isMe ? 'bg-discord-blue/10 border-discord-blue/40 shadow-inner' : ''}`;
                    
                    let rankBox = '';
                    if(rank === 1) rankBox = `<div class="rank-badge rank-1"><i class="fas fa-crown medal-icon"></i></div>`;
                    else if(rank === 2) rankBox = `<div class="rank-badge rank-2"><i class="fas fa-medal medal-icon"></i></div>`;
                    else if(rank === 3) rankBox = `<div class="rank-badge rank-3"><i class="fas fa-medal medal-icon"></i></div>`;
                    else rankBox = `<div class="rank-badge rank-other">${rank}</div>`;

                    item.innerHTML = `
                        ${rankBox}
                        <div class="relative shrink-0">
                            <img src="${user.avatar}" class="w-10 h-10 rounded-full bg-bg-deep shadow-sm border border-white/5" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="font-bold text-white text-sm truncate flex items-center">
                                ${user.name}
                                ${isMe ? '<span class="ml-2 text-[9px] bg-discord-blue text-white px-1.5 py-0.5 rounded font-black tracking-tighter">YOU</span>' : ''}
                            </p>
                            <p class="text-[11px] text-text-muted truncate">ID: ${user.id}</p>
                        </div>
                        <div class="text-right">
                            <div class="text-discord-blue font-black text-lg leading-none">${user.count}</div>
                            <div class="text-[9px] text-text-muted uppercase font-bold tracking-widest">Unlocked</div>
                        </div>
                    `;
                    list.appendChild(item);
                });
            } catch (err) {
                console.error("Ranking Error:", err);
                list.innerHTML = '<p class="text-center py-10 text-text-muted">データの取得に失敗しました</p>';
            }
        };

        const init = async () => {
            // タブ切り替え処理
            const tabAch = document.getElementById('tab-achievements');
            const tabRank = document.getElementById('tab-ranking');
            const secAch = document.getElementById('section-achievements');
            const secRank = document.getElementById('section-ranking');

            tabAch.onclick = () => {
                secAch.classList.remove('hidden');
                secRank.classList.add('hidden');
                tabAch.className = 'bg-[#3f4147] text-white px-2 py-1.5 rounded flex items-center space-x-2 cursor-pointer';
                tabRank.className = 'hover:bg-[#35373c] text-text-muted hover:text-[#dbdee1] px-2 py-1.5 rounded flex items-center space-x-2 cursor-pointer transition';
                document.getElementById('header-icon').className = 'fas fa-hashtag text-text-muted mr-2 text-xl';
                document.getElementById('header-title').innerText = 'achievements';
            };

            tabRank.onclick = () => {
                secAch.classList.add('hidden');
                secRank.classList.remove('hidden');
                tabRank.className = 'bg-[#3f4147] text-white px-2 py-1.5 rounded flex items-center space-x-2 cursor-pointer';
                tabAch.className = 'hover:bg-[#35373c] text-text-muted hover:text-[#dbdee1] px-2 py-1.5 rounded flex items-center space-x-2 cursor-pointer transition';
                document.getElementById('header-icon').className = 'fas fa-chart-line text-text-muted mr-2 text-xl';
                document.getElementById('header-title').innerText = 'leaderboard';
                renderRanking();
            };

            const loginAction = () => {
                window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
            };
            document.getElementById('nav-login-btn').onclick = loginAction;
            document.getElementById('modal-login-btn').onclick = loginAction;

            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                const auth = getAuth(app);
                await signInAnonymously(auth);
            } catch (e) { 
                console.error("Firebase Auth Error:", e); 
            }

            const params = new URLSearchParams(window.location.hash.slice(1));
            const token = params.get('access_token');

            if (token) {
                try {
                    const res = await fetch('https://discord.com/api/users/@me', { headers: { Authorization: `Bearer ${token}` } });
                    if (res.ok) {
                        currentUserData = await res.json();
                        document.getElementById('login-modal').classList.add('hidden');
                        document.getElementById('user-profile').classList.remove('hidden');
                        
                        const fullName = currentUserData.global_name || currentUserData.username;
                        document.getElementById('user-name').childNodes[0].textContent = fullName + " ";
                        document.getElementById('user-id-suffix').innerText = currentUserData.id.substring(0,6);
                        
                        const avatarUrl = currentUserData.avatar 
                            ? `https://cdn.discordapp.com/avatars/${currentUserData.id}/${currentUserData.avatar}.png`
                            : `https://cdn.discordapp.com/embed/avatars/${parseInt(currentUserData.id) % 5}.png`;

                        document.getElementById('user-avatar').src = avatarUrl;
                        document.getElementById('sidebar-avatar').src = avatarUrl;
                        document.getElementById('sidebar-name').innerText = fullName;
                        
                        const statsDocRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'userStats', currentUserData.id);
                        onSnapshot(statsDocRef, (snapshot) => {
                            if (snapshot.exists()) {
                                const data = snapshot.data();
                                achievementData = achievementData.map(ach => {
                                    const newVal = data[ach.id] !== undefined ? Number(data[ach.id]) : 0;
                                    // トースト表示ロジック（初回読み込み時は出さないように判定）
                                    if (newVal >= ach.requirement && ach.current < ach.requirement && ach.current !== 0) {
                                        showToast(ach.title);
                                    }
                                    return { ...ach, current: newVal };
                                });
                                renderAchievements();
                            }
                        }, (error) => { console.error("Firestore Error:", error); });
                    }
                } catch (err) {
                    console.error("Discord API Error:", err);
                }
            }
            renderAchievements();
        };

        init();
    </script>
</body>
