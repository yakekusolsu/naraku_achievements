<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abyss Achievements - Discord Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
        
        :root {
            --bg-deep: #1e1f22;
            --bg-sidebar: #2b2d31;
            --bg-main: #313338;
            --bg-card: #232428;
            --text-normal: #dbdee1;
            --text-muted: #949ba4;
            --discord-blue: #5865f2;
            --discord-green: #23a55a;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-normal);
            margin: 0;
            overflow: hidden;
        }

        /* Discord Layout Structure */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Server Sidebar (Icon bar) */
        .server-sidebar {
            width: 72px;
            background-color: var(--bg-deep);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 12px;
            gap: 8px;
        }

        .server-icon {
            width: 48px;
            height: 48px;
            background-color: var(--bg-main);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .server-icon:hover {
            border-radius: 16px;
            background-color: var(--discord-blue);
            color: white;
        }

        .server-icon.active {
            border-radius: 16px;
            background-color: var(--discord-blue);
        }

        .server-icon.active::before {
            content: "";
            position: absolute;
            left: -12px;
            width: 8px;
            height: 40px;
            background-color: white;
            border-radius: 0 4px 4px 0;
        }

        /* Channel Sidebar */
        .channel-sidebar {
            width: 240px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-top-left-radius: 8px;
        }

        /* Main Chat View */
        .main-content {
            flex: 1;
            background-color: var(--bg-main);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Custom Scrollbar */
        .main-content::-webkit-scrollbar { width: 16px; }
        .main-content::-webkit-scrollbar-track { background: var(--bg-main); }
        .main-content::-webkit-scrollbar-thumb { 
            background: #1a1b1e; 
            border: 4px solid var(--bg-main);
            border-radius: 8px;
        }

        .achievement-card {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 16px;
            border: 1px solid transparent;
            transition: border 0.2s;
        }

        .achievement-card:hover {
            border-color: rgba(255, 255, 255, 0.1);
        }

        .progress-bar {
            height: 8px;
            background: #4e5058;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--discord-blue);
            transition: width 0.3s ease;
        }

        .discord-btn {
            background-color: var(--discord-blue);
            color: white;
            padding: 8px 16px;
            border-radius: 3px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .discord-btn:hover {
            background-color: #4752c4;
        }

        .update-btn {
            background: #4e5058;
            color: white;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 3px;
            margin-top: 12px;
        }

        .update-btn:hover {
            background: #6d6f78;
        }

        .badge-unlocked {
            color: #f1c40f;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Server Sidebar -->
        <aside class="server-sidebar">
            <div class="server-icon active">
                <i class="fas fa-ghost text-xl"></i>
            </div>
            <div class="w-8 h-[2px] bg-[#35363c] my-1"></div>
            <div class="server-icon text-discord-green hover:text-white">
                <i class="fas fa-plus"></i>
            </div>
        </aside>

        <!-- Channel Sidebar -->
        <aside class="channel-sidebar">
            <div class="h-12 border-b border-[#1f2023] flex items-center px-4 shadow-sm">
                <span class="font-bold text-white overflow-hidden text-ellipsis whitespace-nowrap">奈落サーバー</span>
                <i class="fas fa-chevron-down ml-auto text-xs"></i>
            </div>
            <div class="flex-1 p-2 space-y-4">
                <div>
                    <p class="text-[11px] font-bold text-text-muted px-2 mb-1 uppercase tracking-wider">実績メニュー</p>
                    <div class="bg-[#3f4147] text-white px-2 py-1.5 rounded-md flex items-center space-x-2 cursor-pointer">
                        <i class="fas fa-trophy text-sm"></i>
                        <span class="text-[15px] font-medium">実績一覧</span>
                    </div>
                    <div class="hover:bg-[#35373c] text-text-muted hover:text-[#dbdee1] px-2 py-1.5 rounded-md flex items-center space-x-2 cursor-pointer transition">
                        <i class="fas fa-chart-line text-sm"></i>
                        <span class="text-[15px] font-medium">ランキング</span>
                    </div>
                </div>
            </div>
            <!-- Current User Profile in Sidebar -->
            <div id="sidebar-user-info" class="bg-[#232428] p-1.5 h-14 flex items-center space-x-2">
                <div class="relative">
                    <img id="sidebar-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" class="w-8 h-8 rounded-full">
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-discord-green border-[3px] border-[#232428] rounded-full"></div>
                </div>
                <div class="flex-1 min-w-0">
                    <p id="sidebar-name" class="text-xs font-bold text-white truncate">Guest</p>
                    <p class="text-[10px] text-text-muted">Online</p>
                </div>
                <div class="flex text-text-muted space-x-2 px-1">
                    <i class="fas fa-microphone text-xs"></i>
                    <i class="fas fa-headphones text-xs"></i>
                    <i class="fas fa-gear text-xs"></i>
                </div>
            </div>
        </aside>

        <!-- Main View -->
        <main class="main-content">
            <!-- Header -->
            <header class="h-12 border-b border-[#1f2023] flex items-center px-4 shadow-sm sticky top-0 bg-bg-main z-10">
                <i class="fas fa-hashtag text-text-muted mr-2 text-xl"></i>
                <span class="font-bold text-white">achievements</span>
                <div class="ml-auto flex items-center space-x-4 text-text-muted">
                    <i class="fas fa-bell"></i>
                    <i class="fas fa-thumbtack"></i>
                    <i class="fas fa-user-group"></i>
                    <div class="relative">
                        <input type="text" placeholder="検索" class="bg-bg-deep px-2 py-0.5 rounded text-sm w-32 focus:w-48 transition-all">
                    </div>
                    <i class="fas fa-inbox"></i>
                    <i class="fas fa-question-circle"></i>
                </div>
            </header>

            <div class="p-8">
                <!-- Banner/Profile -->
                <div id="user-profile" class="hidden mb-12 bg-bg-sidebar rounded-lg overflow-hidden border border-[#1f2023]">
                    <div class="h-24 bg-discord-blue"></div>
                    <div class="p-6 pt-0 -mt-12 flex flex-col md:flex-row items-end md:items-center space-y-4 md:space-y-0 md:space-x-6">
                        <div class="relative">
                            <img id="user-avatar" src="" class="w-24 h-24 rounded-full border-[6px] border-bg-sidebar bg-bg-sidebar">
                            <div class="absolute bottom-2 right-2 w-6 h-6 bg-discord-green border-[4px] border-bg-sidebar rounded-full"></div>
                        </div>
                        <div class="flex-1">
                            <h2 id="user-name" class="text-2xl font-bold text-white flex items-center">--- <span class="ml-2 text-text-muted font-normal text-sm">#<span id="user-id-suffix">0000</span></span></h2>
                            <div class="flex space-x-4 mt-2">
                                <span class="text-xs font-bold uppercase text-text-muted">実績達成率: <span id="completion-percent" class="text-white">0%</span></span>
                                <span class="text-xs font-bold uppercase text-text-muted">解除済み: <span id="completion-count" class="text-white">0</span> / <span id="total-count">0</span></span>
                            </div>
                        </div>
                        <button id="nav-login-btn" class="discord-btn">
                            <i class="fab fa-discord mr-2"></i> Discordで再認証
                        </button>
                    </div>
                </div>

                <!-- Grid -->
                <div id="achievements-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Cards injected here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-black/80 backdrop-blur-[2px] flex items-center justify-center z-[100] px-4">
        <div class="bg-bg-sidebar p-8 rounded shadow-2xl max-w-sm w-full text-center">
            <i class="fab fa-discord text-5xl text-discord-blue mb-4"></i>
            <h2 class="text-2xl font-bold mb-2 text-white">おかえりなさい！</h2>
            <p class="text-text-muted mb-6 text-sm">実績を確認するにはDiscordアカウントとの連携が必要です。</p>
            <button id="modal-login-btn" class="w-full discord-btn py-3 text-lg">
                ログイン
            </button>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-16 right-4 z-[200]"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDU4KAhuWrDkWAHSQL312F9hd9GULvXfcI",
            authDomain: "naraku-archievements.firebaseapp.com",
            projectId: "naraku-archievements",
            storageBucket: "naraku-archievements.firebasestorage.app",
            messagingSenderId: "1077300098321",
            appId: "1:1077300098321:web:3c4538e4387c09750948b0",
            measurementId: "G-NV3MT8D2VV"
        };

        const CLIENT_ID = '1500128602749141052';
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        const APP_ID = 'naraku-achievements'; 

        let db = null;
        let currentUser = null;

        // --- 実績データを75個に調整 ---
        const baseAchievements = [
            { id: "step1", title: "奈落への一歩", desc: "サーバーに参加し、最初の挨拶をする", icon: "fa-door-open", color: "text-blue-400", requirement: 1, current: 0 },
            { id: "talker", title: "おしゃべり好き", desc: "合計1,000メッセージを送信する", icon: "fa-comments", color: "text-green-400", requirement: 1000, current: 0 },
            { id: "regular", title: "常連客", desc: "サーバーに参加してから3ヶ月が経過する", icon: "fa-calendar-check", color: "text-purple-400", requirement: 90, current: 0 },
            { id: "reaction", title: "リアクション魔", desc: "合計500回リアクションを付ける", icon: "fa-face-grin-stars", color: "text-pink-400", requirement: 500, current: 0 },
            { id: "nightowl", title: "夜更かしの王", desc: "深夜2時以降に30回発言する", icon: "fa-moon", color: "text-indigo-300", requirement: 30, current: 0 },
            { id: "morning", title: "早起きの三文得", desc: "早朝6時台に10回発言する", icon: "fa-sun", color: "text-orange-400", requirement: 10, current: 0 },
            { id: "vc_lover", title: "聞き上手", desc: "ボイスチャンネルに合計50時間滞在する", icon: "fa-headset", color: "text-sky-400", requirement: 50, current: 0 },
            { id: "image_post", title: "写真家", desc: "画像を合計50枚アップロードする", icon: "fa-camera", color: "text-emerald-400", requirement: 50, current: 0 },
            { id: "link_share", title: "情報の運び屋", desc: "URLを20回シェアする", icon: "fa-link", color: "text-cyan-400", requirement: 20, current: 0 },
            { id: "mention_god", title: "メンション職人", desc: "メンションを100回送る", icon: "fa-at", color: "text-red-400", requirement: 100, current: 0 },
            { id: "long_text", title: "語り部", desc: "1000文字以上の長文を1回以上送信する", icon: "fa-feather-pointed", color: "text-amber-200", requirement: 1, current: 0 },
            { id: "bump", title: "広報担当", desc: "サーバー宣伝コマンドを20回実行する", icon: "fa-bullhorn", color: "text-yellow-400", requirement: 20, current: 0 },
            { id: "inviter", title: "人脈の主", desc: "友達を3人サーバーに招待する", icon: "fa-user-plus", color: "text-blue-500", requirement: 3, current: 0 },
            { id: "booster", title: "サーバーの光", desc: "Nitroブーストを1回以上行う", icon: "fa-rocket", color: "text-fuchsia-400", requirement: 1, current: 0 },
            { id: "bug_finder", title: "不具合探偵", desc: "バグ報告を1回以上行う", icon: "fa-bug", color: "text-lime-400", requirement: 1, current: 0 },
            { id: "deep_abyss", title: "深淵の主", desc: "合計メッセージ数が10,000を超える", icon: "fa-crown", color: "text-yellow-500", requirement: 10000, current: 0 },
            { id: "one_year", title: "奈落の主住民", desc: "サーバー参加から1年が経過する", icon: "fa-clock", color: "text-slate-400", requirement: 365, current: 0 },
            { id: "commander", title: "コマンドマスター", desc: "Botコマンドを500回使用する", icon: "fa-terminal", color: "text-gray-300", requirement: 500, current: 0 },
            { id: "supporter", title: "良き相談役", desc: "ヘルプチャンネルで3回回答する", icon: "fa-hands-helping", color: "text-rose-400", requirement: 3, current: 0 },
            { id: "legend", title: "奈落の伝説", desc: "すべての基本実績を解除する", icon: "fa-gem", color: "text-violet-500", requirement: 1, current: 0 }
        ];

        let achievementData = [...baseAchievements];
        const colors = ["text-blue-400", "text-green-400", "text-red-400", "text-yellow-400", "text-purple-400", "text-pink-400", "text-sky-400", "text-emerald-400", "text-orange-400", "text-indigo-400"];
        const icons = ["fa-star", "fa-heart", "fa-bolt", "fa-fire", "fa-shield", "fa-magic", "fa-gem", "fa-anchor", "fa-leaf", "fa-mountain"];
        
        // 21番目から75番目までを生成
        for (let i = 21; i <= 75; i++) {
            let categoryName = "";
            let requirement = 10;
            let icon = icons[i % icons.length];
            let color = colors[i % colors.length];

            if (i <= 30) { categoryName = "【日常】"; requirement = i * 20; icon = "fa-sun"; }
            else if (i <= 40) { categoryName = "【交流】"; requirement = (i - 30) * 15; icon = "fa-users"; }
            else if (i <= 50) { categoryName = "【通話】"; requirement = (i - 40) * 5; icon = "fa-microphone"; }
            else if (i <= 60) { categoryName = "【貢献】"; requirement = (i - 50) * 2; icon = "fa-hand-holding-heart"; }
            else if (i <= 70) { categoryName = "【探索】"; requirement = (i - 60) * 50; icon = "fa-compass"; }
            else { categoryName = "【深淵】"; requirement = (i - 70) * 100; icon = "fa-skull"; color = "text-gray-400"; }

            achievementData.push({
                id: `ach_${i}`,
                title: `${categoryName} 実績 No.${i}`,
                desc: `奈落サーバーでの特別な活動 No.${i} を達成する（目標値: ${requirement.toLocaleString()}）`,
                icon: icon,
                color: color,
                requirement: requirement,
                current: 0
            });
        }

        const updateStatInFirestore = async (statId, newValue) => {
            if (!db || !currentUser) return;
            const docRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'userStats', currentUser.id);
            try {
                await setDoc(docRef, { [statId]: newValue }, { merge: true });
            } catch (e) { console.error("Update failed:", e); }
        };

        function showToast(title) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-[#111214] border-l-4 border-discord-blue p-4 mb-2 shadow-xl flex items-center space-x-3 min-w-[280px] transition-opacity duration-500';
            toast.innerHTML = `<i class="fas fa-trophy text-[#f1c40f]"></i> <span class="text-sm font-bold">${title} を解除！</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 4000);
        }

        const renderAchievements = () => {
            const grid = document.getElementById('achievements-grid');
            if(!grid) return;
            grid.innerHTML = '';
            
            const unlockedCount = achievementData.filter(a => a.current >= a.requirement).length;

            achievementData.forEach(ach => {
                const isUnlocked = ach.current >= ach.requirement;
                const progressPercent = Math.min(100, (ach.current / ach.requirement) * 100);
                const card = document.createElement('div');
                card.className = `achievement-card flex flex-col ${!isUnlocked ? 'opacity-60 grayscale-[0.8]' : ''}`;
                card.innerHTML = `
                    <div class="flex items-start space-x-3">
                        <div class="w-12 h-12 shrink-0 rounded bg-bg-deep flex items-center justify-center relative">
                            <i class="fas ${ach.icon} ${ach.color} text-2xl"></i>
                            ${isUnlocked ? '<div class="absolute -top-1 -right-1 bg-discord-green w-3 h-3 rounded-full border-2 border-bg-card"></div>' : ''}
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-[#f2f3f5] truncate">${ach.title}</h4>
                            <p class="text-[13px] text-text-muted leading-tight mt-1 line-clamp-2">${ach.desc}</p>
                        </div>
                    </div>
                    <div class="mt-4 space-y-1.5">
                        <div class="flex justify-between items-center text-[11px] font-bold uppercase text-text-muted">
                            <span>Progress</span>
                            <span class="${isUnlocked ? 'text-discord-green' : ''}">${ach.current.toLocaleString()} / ${ach.requirement.toLocaleString()}</span>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${progressPercent}%"></div></div>
                        <button class="update-btn" data-id="${ach.id}" data-current="${ach.current}">
                            <i class="fas fa-plus mr-1"></i> Add 1
                        </button>
                    </div>
                `;
                
                card.querySelector('.update-btn').addEventListener('click', (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    const current = parseInt(e.currentTarget.getAttribute('data-current'));
                    updateStatInFirestore(id, current + 1);
                });

                grid.appendChild(card);
            });

            document.getElementById('completion-count').innerText = unlockedCount;
            document.getElementById('total-count').innerText = achievementData.length;
            document.getElementById('completion-percent').innerText = `${Math.round((unlockedCount / achievementData.length) * 100)}%`;
        };

        const init = async () => {
            document.getElementById('nav-login-btn').onclick = () => {
                window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
            };
            document.getElementById('modal-login-btn').onclick = document.getElementById('nav-login-btn').onclick;

            try {
                const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
                const app = initializeApp(config);
                db = getFirestore(app);
                const auth = getAuth(app);
                await signInAnonymously(auth);
            } catch (e) { console.error(e); }

            const params = new URLSearchParams(window.location.hash.slice(1));
            const token = params.get('access_token');

            if (token) {
                const res = await fetch('https://discord.com/api/users/@me', { headers: { Authorization: `Bearer ${token}` } });
                if (res.ok) {
                    currentUser = await res.json();
                    document.getElementById('login-modal').classList.add('hidden');
                    document.getElementById('user-profile').classList.remove('hidden');
                    
                    const fullName = currentUser.global_name || currentUser.username;
                    document.getElementById('user-name').childNodes[0].textContent = fullName + " ";
                    document.getElementById('user-id-suffix').innerText = currentUser.discriminator !== '0' ? currentUser.discriminator : (currentUser.id.substring(0,4));
                    
                    const avatarUrl = `https://cdn.discordapp.com/avatars/${currentUser.id}/${currentUser.avatar}.png`;
                    document.getElementById('user-avatar').src = avatarUrl;
                    document.getElementById('sidebar-avatar').src = avatarUrl;
                    document.getElementById('sidebar-name').innerText = fullName;
                    
                    const statsDoc = doc(db, 'artifacts', APP_ID, 'public', 'data', 'userStats', currentUser.id);
                    onSnapshot(statsDoc, (snapshot) => {
                        if (snapshot.exists()) {
                            const data = snapshot.data();
                            achievementData = achievementData.map(ach => {
                                const newVal = data[ach.id] !== undefined ? Number(data[ach.id]) : 0;
                                if (newVal >= ach.requirement && ach.current < ach.requirement) showToast(ach.title);
                                return { ...ach, current: newVal };
                            });
                            renderAchievements();
                        }
                    }, (error) => { console.error("Firestore Error:", error); });
                }
            }
            renderAchievements();
        };

        init();
    </script>
</body>
</html>
