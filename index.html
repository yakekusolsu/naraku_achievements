    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
        
        :root {
            --bg-deep: #1e1f22;
            --bg-sidebar: #2b2d31;
            --bg-main: #313338;
            --bg-card: #232428;
            --text-normal: #dbdee1;
            --text-muted: #949ba4;
            --discord-blue: #5865f2;
            --discord-green: #23a55a;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-normal);
            margin: 0;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .server-sidebar {
            width: 72px;
            background-color: var(--bg-deep);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 12px;
            gap: 8px;
        }

        .server-icon {
            width: 48px;
            height: 48px;
            background-color: var(--bg-main);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .server-icon:hover {
            border-radius: 16px;
            background-color: var(--discord-blue);
            color: white;
        }

        .server-icon.active {
            border-radius: 16px;
            background-color: var(--discord-blue);
        }

        .server-icon.active::before {
            content: "";
            position: absolute;
            left: -12px;
            width: 8px;
            height: 40px;
            background-color: white;
            border-radius: 0 4px 4px 0;
        }

        .channel-sidebar {
            width: 240px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-top-left-radius: 8px;
        }

        .main-content {
            flex: 1;
            background-color: var(--bg-main);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .main-content::-webkit-scrollbar { width: 16px; }
        .main-content::-webkit-scrollbar-track { background: var(--bg-main); }
        .main-content::-webkit-scrollbar-thumb { 
            background: #1a1b1e; 
            border: 4px solid var(--bg-main);
            border-radius: 8px;
        }

        .achievement-card {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 16px;
            border: 1px solid transparent;
            transition: border 0.2s;
        }

        .achievement-card:hover {
            border-color: rgba(255, 255, 255, 0.1);
        }

        .progress-bar {
            height: 8px;
            background: #4e5058;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--discord-blue);
            transition: width 0.3s ease;
        }

        .discord-btn {
            background-color: var(--discord-blue);
            color: white;
            padding: 8px 16px;
            border-radius: 3px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .discord-btn:hover {
            background-color: #4752c4;
        }

        .update-btn {
            background: #4e5058;
            color: white;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 3px;
            margin-top: 12px;
        }

        .update-btn:hover {
            background: #6d6f78;
        }
    </style>
</head>

            { id: "inviter_3", title: "奈落の外交官", desc: "友達を20人招待する", icon: "fa-handshake", color: "text-blue-500", requirement: 20 },
            { id: "booster", title: "サーバーの光", desc: "Nitroブーストを開始する", icon: "fa-rocket", color: "text-fuchsia-400", requirement: 1 },
            { id: "bug_finder", title: "不具合探偵", desc: "バグ報告を行い承認される", icon: "fa-bug", color: "text-lime-400", requirement: 1 },
            { id: "commander_1", title: "コマンド Lv.1", desc: "Botコマンドを100回使用する", icon: "fa-terminal", color: "text-gray-300", requirement: 100 },
            { id: "commander_2", title: "コマンド Lv.2", desc: "Botコマンドを500回使用する", icon: "fa-terminal", color: "text-gray-400", requirement: 500 },
            { id: "commander_3", title: "自動化の鬼", desc: "Botコマンドを2000回使用する", icon: "fa-gears", color: "text-gray-500", requirement: 2000 },
            { id: "supporter", title: "良き相談役", desc: "ヘルプチャンネルで3回回答する", icon: "fa-hands-helping", color: "text-rose-400", requirement: 3 },
            { id: "event_fan", title: "イベント好き", desc: "公式イベントに3回参加する", icon: "fa-ticket", color: "text-orange-500", requirement: 3 },
            { id: "deep_abyss", title: "深淵の管理者", desc: "合計メッセージ数が100,000を超える", icon: "fa-skull-crossbones", color: "text-red-700", requirement: 100000 },
            { id: "legend", title: "奈落の伝説", desc: "合計50個以上の実績を解除する", icon: "fa-gem", color: "text-violet-500", requirement: 50 }
        ];

        let achievementData = achievementDataMaster.map(a => ({ ...a, current: 0 }));

        const updateStatInFirestore = async (statId, newValue) => {
            if (!db || !currentUser) return;
            const docRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'userStats', currentUser.id);
            try {
                await setDoc(docRef, { [statId]: newValue }, { merge: true });
            } catch (e) { console.error("Update failed:", e); }
        };

        function showToast(title) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-[#111214] border-l-4 border-discord-blue p-4 mb-2 shadow-xl flex items-center space-x-3 min-w-[280px] transition-opacity duration-500';
            toast.innerHTML = `<i class="fas fa-trophy text-[#f1c40f]"></i> <span class="text-sm font-bold">${title} を解除！</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 4000);
        }

        const renderAchievements = () => {
            const grid = document.getElementById('achievements-grid');
            if(!grid) return;
            grid.innerHTML = '';
            
            const unlockedCount = achievementData.filter(a => a.current >= a.requirement).length;

            achievementData.forEach(ach => {
                const isUnlocked = ach.current >= ach.requirement;
                const progressPercent = Math.min(100, (ach.current / ach.requirement) * 100);
                const card = document.createElement('div');
                card.className = `achievement-card flex flex-col ${!isUnlocked ? 'opacity-60 grayscale-[0.8]' : ''}`;
                card.innerHTML = `
                    <div class="flex items-start space-x-3">
                        <div class="w-12 h-12 shrink-0 rounded bg-bg-deep flex items-center justify-center relative">
                            <i class="fas ${ach.icon} ${ach.color} text-2xl"></i>
                            ${isUnlocked ? '<div class="absolute -top-1 -right-1 bg-discord-green w-3 h-3 rounded-full border-2 border-bg-card"></div>' : ''}
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-[#f2f3f5] truncate">${ach.title}</h4>
                            <p class="text-[13px] text-text-muted leading-tight mt-1 line-clamp-2">${ach.desc}</p>
                        </div>
                    </div>
                    <div class="mt-4 space-y-1.5">
                        <div class="flex justify-between items-center text-[11px] font-bold uppercase text-text-muted">
                            <span>Progress</span>
                            <span class="${isUnlocked ? 'text-discord-green' : ''}">${ach.current.toLocaleString()} / ${ach.requirement.toLocaleString()}</span>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${progressPercent}%"></div></div>
                        <button class="update-btn" data-id="${ach.id}">
                            <i class="fas fa-plus mr-1"></i> Add 1
                        </button>
                    </div>
                `;
                
                card.querySelector('.update-btn').addEventListener('click', (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    // Use the centralized userStatsMap to ensure we are adding to the latest value
                    const currentVal = userStatsMap[id] || 0;
                    updateStatInFirestore(id, currentVal + 1);
                });

                grid.appendChild(card);
            });

            document.getElementById('completion-count').innerText = unlockedCount;
            document.getElementById('total-count').innerText = achievementData.length;
            document.getElementById('completion-percent').innerText = `${Math.round((unlockedCount / achievementData.length) * 100)}%`;
        };

        const init = async () => {
            document.getElementById('nav-login-btn').onclick = () => {
                window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
            };
            document.getElementById('modal-login-btn').onclick = document.getElementById('nav-login-btn').onclick;

            try {
                const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
                const app = initializeApp(config);
                db = getFirestore(app);
                const auth = getAuth(app);
                await signInAnonymously(auth);
            } catch (e) { console.error(e); }

            const params = new URLSearchParams(window.location.hash.slice(1));
            const token = params.get('access_token');

            if (token) {
                const res = await fetch('https://discord.com/api/users/@me', { headers: { Authorization: `Bearer ${token}` } });
                if (res.ok) {
                    currentUser = await res.json();
                    document.getElementById('login-modal').classList.add('hidden');
                    document.getElementById('user-profile').classList.remove('hidden');
                    
                    const fullName = currentUser.global_name || currentUser.username;
                    document.getElementById('user-name').childNodes[0].textContent = fullName + " ";
                    document.getElementById('user-id-suffix').innerText = currentUser.discriminator !== '0' ? currentUser.discriminator : (currentUser.id.substring(0,4));
                    
                    const avatarUrl = `https://cdn.discordapp.com/avatars/${currentUser.id}/${currentUser.avatar}.png`;
                    document.getElementById('user-avatar').src = avatarUrl;
                    document.getElementById('sidebar-avatar').src = avatarUrl;
                    document.getElementById('sidebar-name').innerText = fullName;
                    
                    const statsDoc = doc(db, 'artifacts', APP_ID, 'public', 'data', 'userStats', currentUser.id);
                    onSnapshot(statsDoc, (snapshot) => {
                        if (snapshot.exists()) {
                            const data = snapshot.data();
                            userStatsMap = data; // Update global map
                            achievementData = achievementData.map(ach => {
                                const newVal = data[ach.id] !== undefined ? Number(data[ach.id]) : 0;
                                // Only show toast if it's a new achievement unlocked in this session
                                if (newVal >= ach.requirement && ach.current < ach.requirement && ach.current !== 0) {
                                    showToast(ach.title);
                                }
                                return { ...ach, current: newVal };
                            });
                            renderAchievements();
                        }
                    }, (error) => { console.error("Firestore Error:", error); });
                }
            }
            renderAchievements();
        };

        init();
    </script>
</body>
</html>
